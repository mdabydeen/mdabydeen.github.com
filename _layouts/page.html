---
layout: default
---
<main id="main-content" class="shell page-shell">
  <article class="page-card reveal">
    <header class="page-header">
      {% if page.kicker %}
        <p class="kicker">{{ page.kicker }}</p>
      {% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.description %}
        <p class="lede">{{ page.description }}</p>
      {% endif %}
    </header>
    <div class="content-flow">
      {{ content }}
    </div>
  </article>
</main>
